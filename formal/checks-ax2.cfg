[options]
isa rv32i
mode bmc
# ax2 retires a bundle of two, so its trace has two channels.  This is the one
# line that separates this configuration from the reference core's: everything
# below is the same suite proving the same ISA properties against a machine
# that commits two instructions in the same cycle.
nret 2

[depth]
# Same window as the reference core.  ax2's three stages would arguably allow
# a shallower one, but that was measured not to matter: the solver's memory is
# spent building the model (ax2 carries a block-RAM instruction cache the
# reference core does not), not unrolling it -- z3 peaks at the same 1.6 GB at
# depth 4, 8, and 13.  Keep the stronger window until something shows a
# shallower one is needed.
insn     12
reg       4 12
pc_fwd    4 12
pc_bwd    4 12
unique    1 4 12
causal    4 12

[defines]
`define RISCV_FORMAL_ALIGNED_MEM

[verilog-files]
@basedir@/cores/@core@/ax2_rvfi_wrapper.sv
@basedir@/components/core/pipeline5/axcore_pkg.sv
@basedir@/components/core/ax2/ax2_pkg.sv
@basedir@/components/alu/single-cycle/alu.sv
@basedir@/components/core/pipeline5/immdec.sv
@basedir@/components/core/pipeline5/decoder.sv
@basedir@/components/core/pipeline5/branch_cmp.sv
@basedir@/components/muldiv/iterative32/muldiv.sv
@basedir@/components/core/ax2/ax2_regfile.sv
@basedir@/components/core/ax2/ax2_icache.sv
@basedir@/components/core/ax2/ax2_core.sv
