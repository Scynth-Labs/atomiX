[options]
isa rv32i
mode bmc
# One retire per cycle, like the reference core.

[depth]
# The reference core's window.  core.minimal takes more *cycles* per instruction
# than the pipelined core (a load is FETCH -> EXEC -> MEM), so a window this
# deep is if anything more necessary here, not less.
insn     12
reg       4 12
pc_fwd    4 12
pc_bwd    4 12
unique    1 4 12
causal    4 12

[defines]
`define RISCV_FORMAL_ALIGNED_MEM

[verilog-files]
@basedir@/cores/@core@/axcore_rvfi_wrapper.sv
@basedir@/components/core/pipeline5/axcore_pkg.sv
@basedir@/components/alu/single-cycle/alu.sv
@basedir@/components/core/pipeline5/immdec.sv
@basedir@/components/core/pipeline5/decoder.sv
@basedir@/components/core/pipeline5/branch_cmp.sv
@basedir@/components/muldiv/iterative32/muldiv.sv
@basedir@/components/regfile/flipflop/regfile.sv
@basedir@/components/core/minimal/axcore.sv
