# Deep suites: too slow for a per-change gate, and the QEMU-dependent ones
# need a toolchain the runner image does not ship. These cover the evidence
# claims in docs/design-checklist.md that CI cannot afford to run per push.
name: Nightly

on:
  schedule:
    # Off the hour, where the runner queue is shorter.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrated:
    name: Full integrated software and RTL ladder
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-atomix
        with:
          cache-key: nightly-integrated

      # This is the union of the ordinary CI suites plus research contracts,
      # Live FPGA closed-loop faults, accelerator workloads, and architecture
      # variants. Stages run sequentially to avoid shared-build races; the
      # heavyweight campaign jobs below remain parallel shards.
      - name: Integrated verification suite
        run: python3 tools/verify.py run nightly-integrated --keep-going

      - name: Preserve the complete stage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-nightly-integrated
          path: build/verification/nightly-integrated
          if-no-files-found: error
          retention-days: 14

  randomized:
    name: Randomized generation and fuzzing
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-atomix
        with:
          cache-key: randomized

      - name: Randomized verification suite
        run: python3 tools/verify.py run randomized --keep-going

      - name: Preserve the complete stage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-nightly-randomized
          path: build/verification/randomized
          if-no-files-found: error
          retention-days: 14

  isa-suite:
    name: Official RISC-V ISA suite
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # tests/riscv-tests is a submodule and is not needed by any other job.
          submodules: recursive

      - uses: ./.github/actions/setup-atomix
        with:
          cache-key: isa-suite

      - name: Official ISA verification suite
        run: python3 tools/verify.py run isa --keep-going

      - name: Preserve the complete stage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-nightly-isa
          path: build/verification/isa
          if-no-files-found: error
          retention-days: 14

  three-platform:
    name: ISS / QEMU / RTL agreement
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-atomix
        with:
          cache-key: three-platform

      # docs/toolchain.md: Ubuntu 22.04 ships QEMU 6.2, whose RISC-V model
      # traps on `mret` into S/U when no PMP entries are configured. aXcore
      # does not implement optional PMP, so the aXos checks need QEMU >= 7.
      # This builds the same RISC-V-only 8.2.10 that the dependency baseline
      # records, and caches the result so it is a one-off cost.
      - name: Cache the local QEMU build
        id: qemu-cache
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: qemu-riscv32-8.2.10-ubuntu-22.04

      - name: Build QEMU 8.2.10 (riscv32-softmmu only)
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y --no-install-recommends \
            git meson ninja-build pkg-config python3-venv \
            libglib2.0-dev libpixman-1-dev zlib1g-dev libfdt-dev
          git clone --depth 1 --branch v8.2.10 \
            https://github.com/qemu/qemu.git "$RUNNER_TEMP/qemu"
          cd "$RUNNER_TEMP/qemu"
          ./configure --target-list=riscv32-softmmu --prefix="$HOME/.local"
          ninja -C build install

      # The cached tree holds only the binary, which still resolves these at
      # load time. They arrive as dependencies of the -dev packages above, so
      # a cache hit -- which skips that step -- would otherwise leave the
      # runner without them.
      - name: Install the QEMU runtime libraries
        run: |
          sudo apt-get install -y --no-install-recommends \
            libfdt1 libglib2.0-0 libpixman-1-0 zlib1g

      - name: Put the local QEMU first on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Confirm the QEMU version
        run: qemu-system-riscv32 --version

      - name: Three-platform verification suite
        run: python3 tools/verify.py run three-platform --keep-going

      - name: Preserve the complete stage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-nightly-three-platform
          path: build/verification/three-platform
          if-no-files-found: error
          retention-days: 14
