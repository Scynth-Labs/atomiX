# Per-change gate: everything here runs without QEMU, without FPGA tools, and
# without the formal stack, so it needs only the core dependency tier from
# docs/dependencies.md. Suites that need a newer QEMU or an SMT/SAT stack run
# in nightly.yml and formal.yml respectively.
#
# The split between jobs is by cost, not by subject: `quick` fails a broken
# change in about a minute, while the two heavier jobs run in parallel behind
# it and cover composition and aXos.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick:
    name: ISS, profiles, and lock-step cosim
    # Pinned to the host recorded in docs/dependencies.md (Verilator 4.038,
    # RISC-V GCC 10.2). Moving to a newer image is a toolchain change: record
    # it in that table rather than letting `ubuntu-latest` make it silently.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-atomix
        with:
          cache-key: quick

      - name: Quick verification suite
        run: python3 tools/verify.py run ci-quick

      - name: Preserve verification logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-ci-quick
          path: build/verification/ci-quick
          if-no-files-found: error
          retention-days: 7

  unit:
    name: RTL unit testbenches
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      # The core ISA suites build their binaries out of the riscv-tests
      # submodule, so this job needs it checked out. Without it the suites
      # matched nothing and reported a vacuous pass; the runners now treat
      # that as a hard error instead.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-atomix
        with:
          cache-key: unit

      # One Verilator build+run per module, then the directed core programs
      # (interrupt/commit collisions, M/S/U routing, end-to-end Sv32) and the
      # gpu1 and ax2 suites.
      - name: RTL unit verification suite
        run: python3 tools/verify.py run ci-unit

      - name: Preserve verification logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-ci-unit
          path: build/verification/ci-unit
          if-no-files-found: error
          retention-days: 7

  integration:
    name: Composed systems and aXos
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-atomix
        with:
          cache-key: integration

      - name: Composed-system verification suite
        run: python3 tools/verify.py run ci-integration

      - name: Preserve verification logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-ci-integration
          path: build/verification/ci-integration
          if-no-files-found: error
          retention-days: 7
