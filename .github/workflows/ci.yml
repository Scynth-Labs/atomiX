# Per-change gate: everything here runs without QEMU, without FPGA tools, and
# without the formal stack, so it needs only the core dependency tier from
# docs/dependencies.md. Suites that need a newer QEMU or an SMT/SAT stack run
# in nightly.yml and formal.yml respectively.
#
# The split between jobs is by cost, not by subject: `quick` fails a broken
# change in about a minute, while the two heavier jobs run in parallel behind
# it and cover composition and aXos.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick:
    name: ISS, profiles, and lock-step cosim
    # Pinned to the host recorded in docs/dependencies.md (Verilator 4.038,
    # RISC-V GCC 10.2). Moving to a newer image is a toolchain change: record
    # it in that table rather than letting `ubuntu-latest` make it silently.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-atomix
        with:
          cache-key: quick

      - name: Golden ISS and directed traps
        run: make -C sim/axsim test

      - name: Every supplied system profile resolves
        run: make config-check-all

      - name: Every supplied kernel profile resolves
        run: make -C sw/kernel kernel-config-check-all

      - name: Directed lock-step cosimulation
        run: make -C sim/cosim test

  unit:
    name: RTL unit testbenches
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      # The core ISA suites build their binaries out of the riscv-tests
      # submodule, so this job needs it checked out. Without it the suites
      # matched nothing and reported a vacuous pass; the runners now treat
      # that as a hard error instead.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-atomix
        with:
          cache-key: unit

      # One Verilator build+run per module, then the directed core programs
      # (interrupt/commit collisions, M/S/U routing, end-to-end Sv32) and the
      # gpu1 and ax2 suites.
      - name: Per-module testbenches and directed core programs
        run: make -C sim/unit test

  integration:
    name: Composed systems and aXos
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-atomix
        with:
          cache-key: integration

      - name: Component composition across profiles
        run: make component-test

      - name: Bare-metal peripheral paths on RTL
        run: make -C sw/baremetal check-spi check-sd

      # Role completion both ways: polled (check-role) and delivered through
      # the PLIC as a machine external interrupt (check-role-irq).
      - name: Role window and its interrupt path on RTL
        run: make -C sw/baremetal check-role check-role-irq

      - name: aXos shell, role driver, and host-link
        run: make -C sw/kernel check-shell check-role-driver check-role-irq check-hostlink

      - name: aXos 32 KiB primer image and UART kernel upload
        run: make -C sw/kernel check-primer check-uartboot

      - name: aXos on external memory with caches
        run: make -C sw/kernel check-storage
